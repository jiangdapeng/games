<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;

  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#game-container {
  position: relative;
  width: 100vw;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  max-height: 850px;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: auto;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
  will-change: transform;
}

/* Question overlay */
#question-panel {
  display: none;
  position: absolute;
  bottom: 10%;
  left: 5%;
  right: 5%;
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  z-index: 10;
  text-align: center;
}

  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
#q-type { font-size: 14px; color: #888; margin-bottom: 4px; }
#q-text { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 8px; }
#q-timer-bar {
  width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-bottom: 12px; overflow: hidden;
}
#q-timer-fill {
  height: 100%; background: #4CAF50; border-radius: 3px; transition: width 0.1s linear;
}
#q-timer-fill.warning { background: #FF9800; }
#q-timer-fill.danger { background: #f44336; animation: pulse 0.5s infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
.q-btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: 3px solid #e0e0e0;
  border-radius: 14px;
  background: #fff;
  font-size: 17px;
  color: #333;
  cursor: pointer;
  transition: all 0.15s;
}
.q-btn:active { transform: scale(0.97); }
.q-btn.correct { background: #4CAF50; color: #fff; border-color: #388E3C; }
.q-btn.wrong { background: #f44336; color: #fff; border-color: #D32F2F; }

/* Mobile nitro button */
#nitro-btn {
  display: none;
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);

  font-size: 14px;

  cursor: pointer;

#share-btn {

  color: #fff;
  font-size: 17px;
  font-weight: bold;

@media (max-width: 768px) {

<script>
// ============ POLYFILL: roundRect ============
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
    this.beginPath();
    this.moveTo(x + r.tl, y);
    this.lineTo(x + w - r.tr, y);
    this.arcTo(x + w, y, x + w, y + r.tr, r.tr);
    this.lineTo(x + w, y + h - r.br);
    this.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
    this.lineTo(x + r.bl, y + h);
    this.arcTo(x, y + h, x, y + h - r.bl, r.bl);
    this.lineTo(x, y + r.tl);
    this.arcTo(x, y, x + r.tl, y, r.tl);
    this.closePath();
  };
}

// ============ CONSTANTS ============
const CANVAS_W = 480;
const CANVAS_H = 800;

// Road dimensions
const ROAD_LEFT = 80;
const ROAD_RIGHT = 400;
const ROAD_WIDTH = ROAD_RIGHT - ROAD_LEFT;
const LANE_WIDTH = ROAD_WIDTH / 3;
const LANE_CENTERS = [
  ROAD_LEFT + LANE_WIDTH * 0.5,
  ROAD_LEFT + LANE_WIDTH * 1.5,
  ROAD_LEFT + LANE_WIDTH * 2.5
];

// Player
const PLAYER_W = 46;
const PLAYER_H = 80;
const PLAYER_Y = 620;
const FUEL_MAX = 100;
const FUEL_BURN_RATE = 1.8; // per second
const FUEL_CORRECT = 30;
const FUEL_WRONG = 10;
const FUEL_COIN = 5;
const FUEL_BOMB = 30;
const NITRO_MAX = 3;
const NITRO_DURATION = 3; // seconds
const QUESTION_TIMER = 8; // seconds

// Speeds
const BASE_SPEED = 400; // pixels per second
const NITRO_SPEED_MULT = 2;
const SLOW_SPEED = 150;
const SLOW_DURATION = 2; // seconds

// ============ GAME STATE ============
const STATE = { MENU: 'menu', PLAYING: 'playing', ANSWERING: 'answering', GAMEOVER: 'gameover' };

// ============ CANVAS SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

// ============ DOM ELEMENTS ============

// ============ INPUT ============
const keys = {};
let touchStartX = 0;
let touchStartY = 0;

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('touchstart', e => {
  // Don't prevent default in menu/gameover so click event can fire
  if (game.state === STATE.PLAYING || game.state === STATE.ANSWERING) {
    e.preventDefault();
  }
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
});
canvas.addEventListener('touchend', e => {
  // Start/restart game on tap in menu or game over
  if (game.state === STATE.MENU) {
    handleStart(e);
    return;
  }
  if (game.state === STATE.GAMEOVER) {
    // Enforce cooldown to prevent instant restart when finger lifts after death
    if (performance.now() - game.gameOverAt > 600) {
      handleStart(e);
    }
    return;
  }

  e.preventDefault();
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
    if (dx > 0) keys['ArrowRight'] = true;
    else keys['ArrowLeft'] = true;
    setTimeout(() => {
      keys['ArrowLeft'] = false;
      keys['ArrowRight'] = false;
    }, 100);
  }
});

nitroBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  e.stopPropagation();
  // One-shot activation — avoids stuck-key bug on mobile
  if (game.state === STATE.PLAYING && game.player.nitroCharges > 0 && !game.player.nitroActive) {
    game.player.activateNitro();
  }
});

// ============ AUDIO (simple oscillator-based) ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
function playBeep(freq, dur, type='square', vol=0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxCorrect() { playBeep(523, 0.1); setTimeout(() => playBeep(659, 0.1), 100); setTimeout(() => playBeep(784, 0.15), 200); }
function sfxWrong() { playBeep(200, 0.3, 'sawtooth'); }
function sfxCoin() { playBeep(1200, 0.08); playBeep(1600, 0.06, 'sine'); }
function sfxNitro() { playBeep(150, 0.5, 'sawtooth', 0.06); }
function sfxBomb() { playBeep(80, 0.4, 'sawtooth', 0.1); }

// ============ PARTICLES ============
class Particle {
  constructor(x, y, vx, vy, life, color, size=3) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size;
  }
  get alive() { return this.life > 0; }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha + 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class ParticleSystem {
  constructor() { this.particles = []; }
  emit(x, y, count, color, lifeRange=[0.3,0.8], speedRange=[50,200], sizeRange=[2,5]) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
      const life = lifeRange[0] + Math.random() * (lifeRange[1] - lifeRange[0]);
      const size = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed, Math.sin(angle) * speed,
        life, color, size
      ));
    }
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update(dt);
      if (!this.particles[i].alive) this.particles.splice(i, 1);
    }
  }
  draw(ctx) {
    for (const p of this.particles) p.draw(ctx);
  }
}

// ============ FLOATING TEXT ============
class FloatingText {
  constructor(x, y, text, color, life=1.0) {
    this.x = x; this.y = y; this.text = text; this.color = color;
    this.life = life; this.maxLife = life;
  }
  get alive() { return this.life > 0; }
  update(dt) {
    this.y -= 40 * dt;
    this.life -= dt;
  }
  draw(ctx) {
    const alpha = Math.min(1, this.life / this.maxLife);
    const scale = 1 + (1 - this.life / this.maxLife) * 0.3;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(this.x, this.y);
    ctx.scale(scale, scale);
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.strokeText(this.text, 0, 0);
    ctx.fillText(this.text, 0, 0);
    ctx.restore();
  }
}

// ============ LEVEL SYSTEM ============
const LEVELS = [
  { name: '幼儿园', icon: '🎒', threshold: 0, color: '#4CAF50' },
  { name: '小学',   icon: '📚', threshold: 2000, color: '#2196F3' },
  { name: '初中',   icon: '📖', threshold: 4000, color: '#FF9800' },
  { name: '高中',   icon: '🎓', threshold: 6000, color: '#9C27B0' },
  { name: '大学',   icon: '🏛️', threshold: 8000, color: '#E91E63' },
  { name: '博士',   icon: '🔬', threshold: 10000, color: '#F44336' },
];

function getLevelIndex(score) {
  let idx = 0;
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (score >= LEVELS[i].threshold) { idx = i; break; }
  }
  return idx;
}

// ============ QUESTION SYSTEM ============

// --- Master dispatcher ---
function genQuestion(levelIdx) {
  // Question type distribution varies by level
  let types;
  if (levelIdx === 0) types = ['math','math','pinyin','pinyin','pinyin','english'];
  else if (levelIdx <= 1) types = ['math','pinyin','idiom','english'];
  else if (levelIdx <= 2) types = ['math','pinyin','idiom','english'];
  else if (levelIdx <= 3) types = ['math','poetry','idiom','english'];
  else if (levelIdx <= 4) types = ['math','poetry','literature','english'];
  else types = ['math','classics','literature','english'];

  const type = types[Math.floor(Math.random() * types.length)];
  switch (type) {
    case 'math': return genMathQ(levelIdx);
    case 'pinyin': return genPinyinQ(levelIdx);
    case 'idiom': return genIdiomQ(levelIdx);
    case 'poetry': return genPoetryQ(levelIdx);
    case 'literature': return genLiteratureQ(levelIdx);
    case 'classics': return genClassicsQ();
    case 'english': return genEnglishQ(levelIdx);
  }
}

// --- Math Questions by Level ---
function genMathQ(level) {
  let a, b, op, answer, question;

  if (level === 0) {
    // 幼儿园: single digit +/-, result ≤ 20
    op = ['+','-'][Math.floor(Math.random() * 2)];
    if (op === '+') {
      a = Math.floor(Math.random() * 10) + 1;
      b = Math.floor(Math.random() * (20 - a)) + 1;
      answer = a + b;
    } else {
      a = Math.floor(Math.random() * 19) + 2;
      b = Math.floor(Math.random() * (a - 1)) + 1;
      answer = a - b;
    }
    question = `${a} ${op} ${b} = ?`;
  } else if (level === 1) {
    // 小学: 2-digit +/-, simple ×, simple ÷
    const ops = ['+','-','*','/'];
    op = ops[Math.floor(Math.random() * 4)];
    switch(op) {
      case '+':
        a = Math.floor(Math.random() * 90) + 10; b = Math.floor(Math.random() * 90) + 10;
        answer = a + b; break;
      case '-':
        a = Math.floor(Math.random() * 90) + 10; b = Math.floor(Math.random() * a) + 1;
        answer = a - b; break;
      case '*':
        a = Math.floor(Math.random() * 9) + 1; b = Math.floor(Math.random() * 9) + 1;
        answer = a * b; break;
      case '/':
        b = Math.floor(Math.random() * 8) + 2; answer = Math.floor(Math.random() * 9) + 1; a = b * answer;
        break;
    }
    question = `${a} ${op} ${b} = ?`;
  } else if (level === 2) {
    // 初中: larger numbers, fractions, percentages
    const r = Math.random();
    if (r < 0.5) {
      op = ['+','-','*'][Math.floor(Math.random() * 3)];
      a = Math.floor(Math.random() * 900) + 100; b = Math.floor(Math.random() * 900) + 100;
      if (op === '+') answer = a + b;
      else if (op === '-') { if (b > a) [a,b]=[b,a]; answer = a - b; }
      else { a = Math.floor(Math.random() * 90) + 10; b = Math.floor(Math.random() * 20) + 2; answer = a * b; }
      question = `${a} ${op} ${b} = ?`;
    } else if (r < 0.75) {
      // Percentage
      a = Math.floor(Math.random() * 900) + 100;
      b = [10, 20, 25, 30, 50, 75][Math.floor(Math.random() * 6)];
      answer = Math.round(a * b / 100);
      question = `${a} 的 ${b}% 是多少？`;
    } else {
      // Simple fraction
      const nums = [2,3,4,5,8,10];
      const den = nums[Math.floor(Math.random() * nums.length)];
      const num = Math.floor(Math.random() * (den - 1)) + 1;
      a = Math.floor(Math.random() * 200) + 40;
      answer = Math.round(a * num / den);
      const fracLabels = {2:'二分之一',3:'三分之一',4:'四分之一',5:'五分之一',8:'八分之一',10:'十分之一'};
      const label = num === 1 ? fracLabels[den] : `${num}/${den}`;
      question = `${a} 的 ${label} 是多少？`;
    }
  } else {
    // 高中及以上: algebra, exponents, roots, complex math
    const r = Math.random();
    if (r < 0.3) {
      // Solve for x: ax + b = c
      a = Math.floor(Math.random() * 9) + 2;
      answer = Math.floor(Math.random() * 20) + 1;
      b = Math.floor(Math.random() * 40) - 20;
      const c = a * answer + b;
      const bStr = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
      question = `解方程: ${a}x ${bStr} = ${c}, x = ?`;
    } else if (r < 0.6) {
      // Square/cube
      a = Math.floor(Math.random() * 15) + 2;
      const exp = [2, 2, 2, 3][Math.floor(Math.random() * 4)];
      answer = exp === 2 ? a * a : a * a * a;
      question = `${a}${exp === 2 ? '²' : '³'} = ?`;
    } else {
      // √ or complex expression
      const squares = [4,9,16,25,36,49,64,81,100,121,144,169,196,225];
      answer = Math.floor(Math.random() * 12) + 2;
      a = answer * answer;
      question = `√${a} = ?`;
    }
  }

  return {
    type: 'math',
    typeLabel: level <= 1 ? '🧮 数学计算' : (level <= 2 ? '📐 数学运算' : '🔢 数学挑战'),
    question,
    answer,
    options: genMathOptions(answer, level)
  };
}

function genMathOptions(answer, level) {
  const opts = new Set([String(answer)]);
  const range = level <= 1 ? 5 : (level <= 2 ? 15 : 30);
  while (opts.size < 4) {
    const offset = Math.floor(Math.random() * range) + 1;
    const sign = Math.random() > 0.5 ? 1 : -1;
    const fake = answer + sign * offset;
    if (fake >= 0 && fake !== answer && String(fake) !== String(answer)) opts.add(String(fake));
  }
  return shuffle([...opts]);
}

  { word: '囫囵', pinyin: 'hú lún' },        { word: '饕餮', pinyin: 'tāo tiè' },

function genPinyinQ(level) {
  const bank = level <= 1 ? PINYIN_EASY : PINYIN_HARD;
  const item = bank[Math.floor(Math.random() * bank.length)];
  return {
    type: 'pinyin',
    typeLabel: level <= 1 ? '📝 拼音选择' : '🔤 汉字拼音',
    question: `"${item.word}" 的拼音是？`,
    answer: item.pinyin,
    options: genPinyinOptions(item.pinyin, bank)
  };
}

function genPinyinOptions(answer, bank) {
  const opts = new Set([answer]);
  while (opts.size < 4) {
    const d = bank[Math.floor(Math.random() * bank.length)].pinyin;
    if (d !== answer) opts.add(d);
  }
  return shuffle([...opts]);
}

function genEnglishQ(level) {
  const bank = ENGLISH_WORDS[level] || ENGLISH_WORDS[2];
  const item = bank[Math.floor(Math.random() * bank.length)];
  const toChinese = Math.random() > 0.5;

  const levelLabel = level <= 0 ? '🌍 英语启蒙' : (level <= 1 ? '🌍 英语基础' : (level <= 2 ? '🌍 英语进阶' : (level <= 3 ? '🌍 英语提高' : (level <= 4 ? '🌍 专业英语' : '🌍 学术英语'))));

  if (toChinese) {
    return {
      type: 'english',
      typeLabel: levelLabel,
      question: `"${item.en}" 的中文意思是？`,
      answer: item.zh,
      options: genEnglishDistractors(item.zh, bank, 'zh')
    };
  } else {
    return {
      type: 'english',
      typeLabel: levelLabel,
      question: `"${item.zh}" 的英文是？`,
      answer: item.en,
      options: genEnglishDistractors(item.en, bank, 'en')
    };
  }
}

function genEnglishDistractors(answer, bank, field) {
  const opts = new Set([answer]);
  while (opts.size < 4) {
    const d = bank[Math.floor(Math.random() * bank.length)][field];
    if (d !== answer) opts.add(d);
  }
  return shuffle([...opts]);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============ OBSTACLES ============
const OBSTACLE_TYPES = {
  BOMB: 'bomb',
  BROKEN_CAR: 'broken_car',
  COIN: 'coin',
  QUESTION: 'question'
};

class Obstacle {
  constructor(type, lane, y, questionData=null) {
    this.type = type;
    this.lane = lane; // 0, 1, 2
    this.x = LANE_CENTERS[lane];
    this.y = y;
    this.w = 40;
    this.h = 40;
    this.questionData = questionData;
    this.collected = false;
    this.animTimer = 0;
  }

  getBounds() {
    return {
      x: this.x - this.w/2,
      y: this.y - this.h/2,
      w: this.w,
      h: this.h
    };
  }

  update(dt) {
    this.animTimer += dt;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    switch (this.type) {
      case OBSTACLE_TYPES.BOMB:
        this.drawBomb(ctx);
        break;
      case OBSTACLE_TYPES.BROKEN_CAR:
        this.drawBrokenCar(ctx);
        break;
      case OBSTACLE_TYPES.COIN:
        this.drawCoin(ctx);
        break;
      case OBSTACLE_TYPES.QUESTION:
        this.drawQuestionBubble(ctx);
        break;
    }
    ctx.restore();
  }

  drawBomb(ctx) {
    // Bomb body - dark circle
    const bob = Math.sin(this.animTimer * 6) * 2;
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Fuse
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.quadraticCurveTo(10, -24, 6 + bob, -28);
    ctx.stroke();

    // Spark
    ctx.fillStyle = '#FF6'; ctx.beginPath();
    ctx.arc(6 + bob, -28, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F90'; ctx.beginPath();
    ctx.arc(6 + bob, -28, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFF'; ctx.beginPath();
    ctx.arc(6 + bob, -28, 1.2, 0, Math.PI*2); ctx.fill();

    // Skull-like highlight
    ctx.fillStyle = '#555'; ctx.beginPath();
    ctx.arc(-4, -3, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#555'; ctx.beginPath();
    ctx.arc(4, -3, 5, 0, Math.PI*2); ctx.fill();
  }

  drawBrokenCar(ctx) {
    // Warning triangle
    ctx.fillStyle = '#FFD600';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-16, 12);
    ctx.lineTo(16, 12);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#E65100';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Exclamation mark in triangle
    ctx.fillStyle = '#000';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, 2);
  }

  drawCoin(ctx) {
    const scale = 1 + Math.sin(this.animTimer * 4) * 0.1;
    ctx.scale(scale, scale);

    // Outer ring
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner circle
    ctx.fillStyle = '#FFC107';
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.fill();

    // Dollar sign
    ctx.fillStyle = '#B8860B';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 1);
  }

  drawQuestionBubble(ctx) {
    const bob = Math.sin(this.animTimer * 3) * 3;

    // Glow
    const glowGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 28);
    glowGrad.addColorStop(0, 'rgba(255,215,0,0.4)');
    glowGrad.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 28, 0, Math.PI * 2);
    ctx.fill();

    // Bubble body
    ctx.fillStyle = '#FFF8E1';
    ctx.beginPath();
    ctx.arc(0, bob, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Question mark
    ctx.fillStyle = '#FF8F00';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', 0, bob);

    // Small star sparkles
    const sparkles = [{x:-14,y:-12},{x:14,y:-8},{x:-8,y:14},{x:12,y:12}];
    ctx.fillStyle = '#FFD700';
    for (const s of sparkles) {
      const sx = s.x + Math.sin(this.animTimer * 5 + s.x) * 2;
      const sy = s.y + Math.cos(this.animTimer * 5 + s.y) * 2;
      ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI*2); ctx.fill();
    }
  }
}

// ============ PLAYER ============
class Player {
  constructor() {
    this.lane = 1; // middle lane
    this.targetLane = 1;
    this.x = LANE_CENTERS[this.lane];
    this.y = PLAYER_Y;
    this.w = PLAYER_W;
    this.h = PLAYER_H;
    this.fuel = FUEL_MAX;
    this.nitroCharges = 0;
    this.nitroActive = false;
    this.nitroTimer = 0;
    this.slowed = false;
    this.slowTimer = 0;
    this.animTimer = 0;
    this.combo = 0;
  }

  getBounds() {
    return {
      x: this.x - this.w/2,
      y: this.y - this.h/2,
      w: this.w,
      h: this.h
    };
  }

  update(dt, gameSpeed) {
    this.animTimer += dt;

    // Lane switching animation — constant smooth speed
    const targetX = LANE_CENTERS[this.targetLane];
    const dx = targetX - this.x;
    const moveSpeed = 480; // px/s, smooth lane change ~0.22s
    if (Math.abs(dx) < moveSpeed * dt) {
      this.x = targetX;
      this.lane = this.targetLane;
    } else {
      this.x += Math.sign(dx) * moveSpeed * dt;
    }

    // Fuel depletion
    const burnRate = this.nitroActive ? FUEL_BURN_RATE * 0.5 : FUEL_BURN_RATE;
    this.fuel -= burnRate * dt;
    if (this.fuel < 0) this.fuel = 0;

    // Nitro
    if (this.nitroActive) {
      this.nitroTimer -= dt;
      if (this.nitroTimer <= 0) {
        this.nitroActive = false;
        this.nitroTimer = 0;
      }
    }

    // Slow debuff
    if (this.slowed) {
      this.slowTimer -= dt;
      if (this.slowTimer <= 0) {
        this.slowed = false;
        this.slowTimer = 0;
      }
    }
  }

  getCurrentSpeed() {
    let speed = BASE_SPEED;
    if (this.slowed) speed = SLOW_SPEED;
    if (this.nitroActive) speed = BASE_SPEED * NITRO_SPEED_MULT;
    return speed;
  }

  activateNitro() {
    if (this.nitroCharges > 0 && !this.nitroActive) {
      this.nitroCharges--;
      this.nitroActive = true;
      this.nitroTimer = NITRO_DURATION;
      sfxNitro();
      return true;
    }
    return false;
  }

  addFuel(amount) {
    this.fuel = Math.min(FUEL_MAX, this.fuel + amount);
  }

  removeFuel(amount) {
    this.fuel = Math.max(0, this.fuel - amount);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Nitro flame
    if (this.nitroActive) {
      this.drawNitroFlame(ctx);
    }

    // Normal exhaust — deterministic pulse, no flicker
    if (!this.nitroActive) {
      const pulse = Math.sin(this.animTimer * 18) * 0.5 + 0.5;
      ctx.fillStyle = '#999';
      ctx.fillRect(-5, this.h/2 - 5, 4, 4 + pulse * 5);
      ctx.fillRect(1, this.h/2 - 5, 4, 3 + pulse * 4);
    }

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, this.h/2 + 4, this.w/2, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // Car body
    const bodyGrad = ctx.createLinearGradient(0, -this.h/2, 0, this.h/2);
    bodyGrad.addColorStop(0, '#FF5252');
    bodyGrad.addColorStop(0.5, '#E53935');
    bodyGrad.addColorStop(1, '#C62828');
    ctx.fillStyle = bodyGrad;
    this.roundRect(ctx, -this.w/2, -this.h/2 + 8, this.w, this.h - 16, 8);
    ctx.fill();
    ctx.strokeStyle = '#B71C1C';
    ctx.lineWidth = 2;
    this.roundRect(ctx, -this.w/2, -this.h/2 + 8, this.w, this.h - 16, 8);
    ctx.stroke();

    // Roof/cabin
    const roofGrad = ctx.createLinearGradient(0, -8, 0, 16);
    roofGrad.addColorStop(0, '#FF8A80');
    roofGrad.addColorStop(1, '#E53935');
    ctx.fillStyle = roofGrad;
    this.roundRect(ctx, -14, -12, 28, 28, 6);
    ctx.fill();
    ctx.strokeStyle = '#C62828';
    ctx.lineWidth = 1.5;
    this.roundRect(ctx, -14, -12, 28, 28, 6);
    ctx.stroke();

    // Windows
    ctx.fillStyle = '#81D4FA';
    this.roundRect(ctx, -10, -9, 8, 12, 3); ctx.fill();
    ctx.strokeStyle = '#4FC3F7';
    ctx.lineWidth = 1;
    this.roundRect(ctx, -10, -9, 8, 12, 3); ctx.stroke();

    this.roundRect(ctx, 2, -9, 8, 12, 3); ctx.fill();
    this.roundRect(ctx, 2, -9, 8, 12, 3); ctx.stroke();

    // Racing stripe
    ctx.fillStyle = '#FFF';
    ctx.fillRect(-3, -this.h/2 + 10, 6, this.h - 20);

    // Headlights (front = top in our view)
    ctx.fillStyle = '#FFEB3B';
    ctx.beginPath(); ctx.arc(-10, -this.h/2 + 12, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -this.h/2 + 12, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(-10, -this.h/2 + 12, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -this.h/2 + 12, 2.5, 0, Math.PI*2); ctx.fill();

    // Tail lights
    ctx.fillStyle = '#F44336';
    ctx.beginPath(); ctx.arc(-10, this.h/2 - 12, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, this.h/2 - 12, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF8A80';
    ctx.beginPath(); ctx.arc(-10, this.h/2 - 12, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, this.h/2 - 12, 2.5, 0, Math.PI*2); ctx.fill();

    // Wheels
    this.drawWheel(ctx, -this.w/2 + 1, -this.h/2 + 26);
    this.drawWheel(ctx, this.w/2 - 1, -this.h/2 + 26);
    this.drawWheel(ctx, -this.w/2 + 1, this.h/2 - 26);
    this.drawWheel(ctx, this.w/2 - 1, this.h/2 - 26);

    ctx.restore();
  }

  drawWheel(ctx, wx, wy) {
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(wx, wy, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Hub
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.arc(wx, wy, 3, 0, Math.PI * 2);
    ctx.fill();

    // Spokes (rotate with animation)
    ctx.strokeStyle = '#AAA';
    ctx.lineWidth = 1;
    const rotation = this.animTimer * 8;
    for (let i = 0; i < 4; i++) {
      const angle = rotation + i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(angle) * 5, wy + Math.sin(angle) * 5);
      ctx.stroke();
    }
  }

  drawNitroFlame(ctx) {
    const rearY = this.h / 2; // flame sprays from rear (bottom of car)
    const particles = 14;
    for (let i = 0; i < particles; i++) {
      const spread = (Math.random() - 0.5) * 22;
      const length = 18 + Math.random() * 30;
      const alpha = 0.4 + Math.random() * 0.6;

      ctx.fillStyle = `rgba(100, 140, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(spread, rearY + length * (0.3 + Math.random() * 0.7), 2 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Core flame — sprays downward (rear direction)
    const flameGrad = ctx.createLinearGradient(0, rearY, 0, rearY + 35);
    flameGrad.addColorStop(0, '#E3F2FD');
    flameGrad.addColorStop(0.3, '#90CAF9');
    flameGrad.addColorStop(0.6, '#5C6BC0');
    flameGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(-12, rearY);
    ctx.quadraticCurveTo(6, rearY + 22, 0, rearY + 38);
    ctx.quadraticCurveTo(-6, rearY + 22, 12, rearY);
    ctx.fill();
  }

  roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
}

// ============ GAME CLASS ============
class Game {
  constructor() {
    this.state = STATE.MENU;
    this.player = new Player();
    this.obstacles = [];
    this.particles = new ParticleSystem();
    this.floatingTexts = [];
    this.particles2 = new ParticleSystem(); // secondary system for extra effects
    this.floatingTexts2 = [];

    // Scrolling
    this.roadOffset = 0;
    this.bgOffset1 = 0;
    this.bgOffset2 = 0;
    this.bgOffset3 = 0;

    // Timers
    this.elapsedTime = 0;
    this.obstacleTimer = 0;
    this.questionTimer = 0;

    // Countdown
    this.startCountdown = 0;

    // Question
    this.currentQuestion = null;
    this.questionTimeLeft = 0;
    this.answerLocked = false;

    // Score
    this.score = 0;
    this.totalCorrect = 0;
    this.maxCombo = 0;

    // Screen shake
    this.shakeAmount = 0;
    this.shakeDuration = 0;

    // Best score
    this.bestScore = parseInt(localStorage.getItem('studyrace_best') || '0');

    // Input cooldowns
    this.laneInputCooldown = 0;
    this.nitroInputCooldown = 0;

    // Prevent instant restart on mobile after game over
    this.gameOverAt = 0;
  }

  start() {
    initAudio();
    this.player = new Player();
    this.obstacles = [];
    this.particles = new ParticleSystem();
    this.floatingTexts = [];
    this.particles2 = new ParticleSystem();
    this.floatingTexts2 = [];
    this.roadOffset = 0;
    this.elapsedTime = 0;
    this.obstacleTimer = 0;
    this.questionTimer = 3; // first question appears after 3s
    this.currentQuestion = null;
    this.questionTimeLeft = 0;
    this.answerLocked = false;
    this.score = 0;
    this.totalCorrect = 0;
    this.maxCombo = 0;
    this.shakeAmount = 0;
    this.shakeDuration = 0;
    this.gameOverAt = 0;
    this.startCountdown = 3; // 3-second countdown
    this.state = STATE.PLAYING;
    questionPanel.classList.remove('active');
    document.getElementById('share-btn').classList.remove('show');
  }

  update(dt) {
    // Clamp dt to avoid huge jumps
    if (dt > 0.1) dt = 0.1;

    // Update particles even in menu (for visual flair)
    this.particles.update(dt);
    this.particles2.update(dt);
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      this.floatingTexts[i].update(dt);
      if (!this.floatingTexts[i].alive) this.floatingTexts.splice(i, 1);
    }
    for (let i = this.floatingTexts2.length - 1; i >= 0; i--) {
      this.floatingTexts2[i].update(dt);
      if (!this.floatingTexts2[i].alive) this.floatingTexts2.splice(i, 1);
    }

    if (this.state === STATE.MENU) {
      this.updateMenu(dt);
    } else if (this.state === STATE.PLAYING) {
      this.updatePlaying(dt);
    } else if (this.state === STATE.ANSWERING) {
      this.updateAnswering(dt);
    } else if (this.state === STATE.GAMEOVER) {
      this.updateGameOver(dt);
    }
  }

  updateMenu(dt) {
    this.roadOffset += BASE_SPEED * 0.6 * dt;
    this.bgOffset1 += 15 * dt;
    this.bgOffset2 += 25 * dt;
    this.bgOffset3 += 40 * dt;

    // Auto-spawn some decorative obstacles
  }

  updatePlaying(dt) {
    // Start countdown - pause game logic until countdown finishes
    if (this.startCountdown > 0) {
      this.startCountdown -= dt;
      this.roadOffset += BASE_SPEED * 0.5 * dt;
      this.bgOffset1 += 15 * dt;
      this.bgOffset2 += 25 * dt;
      this.bgOffset3 += 40 * dt;
      return;
    }

    this.elapsedTime += dt;
    this.score += Math.floor(10 * dt);

    // Level-based scaling (obstacle frequency increases with level)
    const levelIdx = getLevelIndex(this.score);

    // Input handling
    this.laneInputCooldown -= dt;
    this.nitroInputCooldown -= dt;

    if (this.laneInputCooldown <= 0) {
      if (keys['ArrowLeft'] && this.player.targetLane > 0) {
        this.player.targetLane--;
        this.laneInputCooldown = 0.15;
      }
      if (keys['ArrowRight'] && this.player.targetLane < 2) {
        this.player.targetLane++;
        this.laneInputCooldown = 0.15;
      }
    }

    if (this.nitroInputCooldown <= 0) {
      if (keys[' ']) {
        if (this.player.activateNitro()) {
          this.nitroInputCooldown = 0.5;
        }
      }
    }

    // Update player
    this.player.update(dt, this.getSpeed());

    // Check game over
    if (this.player.fuel <= 0) {
      this.gameOver();
      return;
    }

    const speed = this.getSpeed();

    // Scroll road
    this.roadOffset += speed * dt;
    // Parallax backgrounds
    this.bgOffset1 += speed * 0.15 * dt;
    this.bgOffset2 += speed * 0.3 * dt;
    this.bgOffset3 += speed * 0.5 * dt;

    // Spawn obstacles
    this.obstacleTimer += dt;
    const obstacleInterval = Math.max(0.4, 2.6 - levelIdx * 0.45);
    if (this.obstacleTimer >= obstacleInterval) {
      this.obstacleTimer = 0;
      this.spawnObstacle();
    }

    // Spawn questions
    this.questionTimer += dt;
    const questionInterval = Math.max(4, 11 - levelIdx * 1.2);
    if (this.questionTimer >= questionInterval) {
      this.questionTimer = 0;
      this.spawnQuestion();
    }

    // Update obstacles
    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const obs = this.obstacles[i];
      obs.update(dt);
      obs.y += speed * dt;

      // Check collision
      if (!obs.collected && this.checkCollision(this.player.getBounds(), obs.getBounds())) {
        this.handleCollision(obs, i);
      }

      // Remove off-screen
      if (obs.y > CANVAS_H + 80) {
        this.obstacles.splice(i, 1);
      }
    }

    // Update shake
    if (this.shakeDuration > 0) {
      this.shakeDuration -= dt;
      this.shakeAmount = this.shakeDuration > 0 ? this.shakeAmount * 0.9 : 0;
    }
  }

  updateAnswering(dt) {
    // Update timer
    this.questionTimeLeft -= dt;
    if (this.questionTimeLeft <= 0 && !this.answerLocked) {
      this.answerLocked = true;
      this.handleWrongAnswer();
    }

    // Update timer bar
    const pct = (this.questionTimeLeft / QUESTION_TIMER) * 100;
    qTimerFill.style.width = pct + '%';
    qTimerFill.className = '';
    if (pct < 25) qTimerFill.className = 'danger';
    else if (pct < 50) qTimerFill.className = 'warning';
  }

  updateGameOver(dt) {
    this.roadOffset += 30 * dt;
    if (keys[' '] || keys['Enter']) {
      this.start();
    }
  }

  getSpeed() {
    // Level-based speed: +8% per level, 1.0x → 1.4x
    const lvlIdx = getLevelIndex(this.score);
    const lvlMult = 1 + lvlIdx * 0.08;
    return this.player.getCurrentSpeed() * lvlMult;
  }

  spawnObstacle() {
    const lane = Math.floor(Math.random() * 3);
    // Don't spawn on same lane as an existing obstacle near the spawn point
    const nearSpawn = this.obstacles.filter(o => o.y < 80);
    const laneOccupied = nearSpawn.some(o => o.lane === lane);

    // Pick type
    const r = Math.random();
    let type;
    if (r < 0.4) type = OBSTACLE_TYPES.BOMB;
    else if (r < 0.75) type = OBSTACLE_TYPES.BROKEN_CAR;
    else type = OBSTACLE_TYPES.COIN;

    // Coins can spawn on occupied lanes (they're good)
    const finalLane = (type === OBSTACLE_TYPES.COIN || !laneOccupied) ? lane : (lane + 1) % 3;

    this.obstacles.push(new Obstacle(type, finalLane, -80));
  }

  spawnQuestion() {
    // Pick a lane not occupied near spawn
    let lane = Math.floor(Math.random() * 3);
    const nearSpawn = this.obstacles.filter(o => o.y < 80);
    const occupied = new Set(nearSpawn.map(o => o.lane));
    if (occupied.size >= 3) return; // all lanes busy
    while (occupied.has(lane)) lane = (lane + 1) % 3;

    // Generate question based on current level
    const levelIdx = getLevelIndex(this.score);
    const qData = genQuestion(levelIdx);
    this.obstacles.push(new Obstacle(OBSTACLE_TYPES.QUESTION, lane, -80, qData));
  }

  checkCollision(a, b) {
    const margin = 8; // forgiving hitbox
    return (
      a.x < b.x + b.w - margin &&
      a.x + a.w > b.x + margin &&
      a.y < b.y + b.h - margin &&
      a.y + a.h > b.y + margin
    );
  }

  handleCollision(obs, index) {
    obs.collected = true;

    switch (obs.type) {
      case OBSTACLE_TYPES.BOMB:
        if (this.player.nitroActive) {
          // Destroy bomb!
          this.particles.emit(obs.x, obs.y, 20, '#FF6D00', [0.3, 0.7], [80, 250], [2, 6]);
          this.floatingTexts.push(new FloatingText(obs.x, obs.y, '+150', '#FFD700'));
          this.score += 150;
          sfxCoin();
        } else {
          // Hit!
          this.player.removeFuel(FUEL_BOMB);
          this.shakeAmount = 10;
          this.shakeDuration = 0.4;
          this.particles.emit(obs.x, obs.y, 15, '#FF1744', [0.3, 0.6], [60, 180], [2, 5]);
          this.floatingTexts.push(new FloatingText(obs.x, obs.y, '-30⛽', '#F44336'));
          sfxBomb();
          if (this.player.fuel <= 0) this.gameOver();
        }
        break;

      case OBSTACLE_TYPES.BROKEN_CAR:
        if (this.player.nitroActive) {
          this.particles.emit(obs.x, obs.y, 12, '#FF6D00', [0.2, 0.5], [60, 150]);
          this.floatingTexts.push(new FloatingText(obs.x, obs.y, '+150', '#FFD700'));
          this.score += 150;
          sfxCoin();
        } else {
          this.player.removeFuel(20);
          this.player.slowed = true;
          this.player.slowTimer = SLOW_DURATION;
          this.particles.emit(obs.x, obs.y, 10, '#FFC107', [0.3, 0.5], [40, 120]);
          this.floatingTexts.push(new FloatingText(obs.x, obs.y, '-20⛽ 减速!', '#FF9800'));
          playBeep(300, 0.2, 'sawtooth');
          if (this.player.fuel <= 0) this.gameOver();
        }
        break;

      case OBSTACLE_TYPES.COIN:
        this.player.addFuel(FUEL_COIN);
        this.score += 100;
        this.particles.emit(obs.x, obs.y, 15, '#FFD700', [0.3, 0.6], [60, 200], [2, 5]);
        this.floatingTexts.push(new FloatingText(obs.x, obs.y, '+100', '#FFD700'));
        sfxCoin();
        break;

      case OBSTACLE_TYPES.QUESTION:
        this.triggerQuestion(obs);
        break;
    }

    if (obs.type !== OBSTACLE_TYPES.QUESTION) {
      this.obstacles.splice(index, 1);
    }
  }

  triggerQuestion(obs) {
    this.state = STATE.ANSWERING;
    this.currentQuestion = obs.questionData;
    this.questionTimeLeft = QUESTION_TIMER;
    this.answerLocked = false;

    // Show question panel
    qType.textContent = obs.questionData.typeLabel;
    qText.textContent = obs.questionData.question;
    qTimerFill.style.width = '100%';
    qTimerFill.className = '';

    qOptions.innerHTML = '';
    obs.questionData.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'q-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => this.submitAnswer(opt, btn));
      // Prevent touch events from propagating
      btn.addEventListener('touchstart', e => e.stopPropagation());
      qOptions.appendChild(btn);
    });

    questionPanel.classList.add('active');

    // Remove question obstacle from road
    const idx = this.obstacles.indexOf(obs);
    if (idx >= 0) this.obstacles.splice(idx, 1);
  }

  submitAnswer(answer, btnElement) {
    if (this.answerLocked) return;
    this.answerLocked = true;

    const correct = String(answer) === String(this.currentQuestion.answer);

    // Highlight correct/wrong
    const buttons = qOptions.querySelectorAll('.q-btn');
    buttons.forEach(b => {
      if (String(b.textContent) === String(this.currentQuestion.answer)) {
        b.classList.add('correct');
      } else if (b === btnElement && !correct) {
        b.classList.add('wrong');
      }
    });

    if (correct) {
      this.handleCorrectAnswer();
    } else {
      this.handleWrongAnswer();
    }
  }

  handleCorrectAnswer() {
    this.player.addFuel(FUEL_CORRECT);
    this.player.nitroCharges = Math.min(NITRO_MAX, this.player.nitroCharges + 1);
    this.player.combo++;
    this.totalCorrect++;
    if (this.player.combo > this.maxCombo) this.maxCombo = this.player.combo;

    let points = 200;
    if (this.player.combo >= 3) {
      points += 300;
      this.floatingTexts.push(new FloatingText(CANVAS_W/2, PLAYER_Y - 40, '连击! +300', '#FFD700', 1.5));
    }

    this.score += points;
    this.floatingTexts2.push(new FloatingText(CANVAS_W/2, PLAYER_Y - 20, '✓ +' + points, '#4CAF50', 1.2));
    this.particles2.emit(CANVAS_W/2, PLAYER_Y, 25, '#4CAF50', [0.4, 0.9], [80, 250], [2, 6]);

    sfxCorrect();
    setTimeout(() => this.resumeGame(), 800);
  }

  handleWrongAnswer() {
    // Wrong answer halves current fuel
    this.player.fuel = Math.max(1, Math.floor(this.player.fuel / 2));
    this.player.combo = 0;

    this.floatingTexts2.push(new FloatingText(CANVAS_W/2, PLAYER_Y - 20, '✗ 答错了', '#F44336', 1.0));
    this.particles2.emit(CANVAS_W/2, PLAYER_Y, 12, '#F44336', [0.3, 0.6], [50, 150], [2, 4]);

    sfxWrong();
    setTimeout(() => {
      if (this.player.fuel <= 0) {
        this.gameOver();
      } else {
        this.resumeGame();
      }
    }, 800);
  }

  resumeGame() {
    questionPanel.classList.remove('active');
    this.currentQuestion = null;
    this.state = STATE.PLAYING;
  }

  gameOver() {
    this.state = STATE.GAMEOVER;
    this.gameOverAt = performance.now(); // prevent instant restart on mobile
    if (this.score > this.bestScore) {
      this.bestScore = this.score;
      localStorage.setItem('studyrace_best', this.bestScore);
    }
    questionPanel.classList.remove('active');
    document.getElementById('share-btn').classList.add('show');
    sfxWrong();
  }

  render() {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    // Apply screen shake
    let shakeX = 0, shakeY = 0;
    if (this.shakeDuration > 0) {
      shakeX = (Math.random() - 0.5) * this.shakeAmount * 2;
      shakeY = (Math.random() - 0.5) * this.shakeAmount * 2;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    this.drawBackground();
    this.drawRoad();
    this.drawObstacles();
    this.drawPlayer();

    // Particles (behind UI but in game space)
    this.particles.draw(ctx);
    this.particles2.draw(ctx);

    ctx.restore();

    // Floating texts (not affected by shake)
    for (const ft of this.floatingTexts) ft.draw(ctx);
    for (const ft of this.floatingTexts2) ft.draw(ctx);

    // UI (not affected by shake)
    this.drawUI();

    // Start countdown overlay
    if (this.startCountdown > 0) this.drawCountdown();

    // Overlay screens
    if (this.state === STATE.MENU) this.drawMenu();
    if (this.state === STATE.GAMEOVER) this.drawGameOver();
  }

  drawBackground() {
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
    skyGrad.addColorStop(0, '#87CEEB');
    skyGrad.addColorStop(0.3, '#B3E5FC');
    skyGrad.addColorStop(0.7, '#E1F5FE');
    skyGrad.addColorStop(1, '#FFF');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Clouds (parallax layer 1 - slowest)
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    this.drawCloud(60, (200 + this.bgOffset1) % (CANVAS_H + 100) - 50);
    this.drawCloud(250, (400 + this.bgOffset1 * 0.8) % (CANVAS_H + 100) - 50);
    this.drawCloud(380, (150 + this.bgOffset1 * 1.1) % (CANVAS_H + 100) - 50);

    // Mountains (parallax layer 2)
    ctx.fillStyle = '#81C784';
    this.drawMountain(40, 300 + this.bgOffset2 % 300, 60, 150);
    this.drawMountain(200, 280 + this.bgOffset2 * 0.9 % 300, 80, 180);
    this.drawMountain(350, 310 + this.bgOffset2 * 1.1 % 300, 70, 160);

    ctx.fillStyle = '#66BB6A';
    this.drawMountain(120, 290 + this.bgOffset2 % 300, 50, 120);
    this.drawMountain(300, 270 + this.bgOffset2 * 0.95 % 300, 55, 130);

    // Green grass areas
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(0, 0, ROAD_LEFT, CANVAS_H);
    ctx.fillRect(ROAD_RIGHT, 0, CANVAS_W - ROAD_RIGHT, CANVAS_H);

    // Grass detail stripes
    ctx.fillStyle = '#66BB6A';
    for (let y = this.bgOffset3 % 60; y < CANVAS_H; y += 60) {
      ctx.fillRect(10, y, 30, 20);
      ctx.fillRect(CANVAS_W - 40, y + 30, 30, 20);
    }

    // Trees on grass
    this.drawTree(20, (100 + this.bgOffset3 * 0.5) % (CANVAS_H + 80) - 40);
    this.drawTree(55, (300 + this.bgOffset3 * 0.5) % (CANVAS_H + 80) - 40);
    this.drawTree(30, (550 + this.bgOffset3 * 0.5) % (CANVAS_H + 80) - 40);
    this.drawTree(CANVAS_W - 25, (200 + this.bgOffset3 * 0.5) % (CANVAS_H + 80) - 40);
    this.drawTree(CANVAS_W - 55, (480 + this.bgOffset3 * 0.5) % (CANVAS_H + 80) - 40);
    this.drawTree(CANVAS_W - 30, (700 + this.bgOffset3 * 0.5) % (CANVAS_H + 80) - 40);
  }

  drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.arc(x + 18, y - 8, 18, 0, Math.PI * 2);
    ctx.arc(x + 35, y, 16, 0, Math.PI * 2);
    ctx.arc(x + 15, y + 5, 15, 0, Math.PI * 2);
    ctx.fill();
  }

  drawMountain(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x - w/2, y);
    ctx.lineTo(x, y - h);
    ctx.lineTo(x + w/2, y);
    ctx.closePath();
    ctx.fill();
    // Snow cap
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(x - w/6, y - h * 0.7);
    ctx.lineTo(x, y - h);
    ctx.lineTo(x + w/6, y - h * 0.7);
    ctx.closePath();
    ctx.fill();
  }

  drawTree(x, y) {
    // Trunk
    ctx.fillStyle = '#8D6E63';
    ctx.fillRect(x - 4, y, 8, 25);
    // Canopy
    ctx.fillStyle = '#388E3C';
    ctx.beginPath();
    ctx.arc(x, y - 5, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#43A047';
    ctx.beginPath();
    ctx.arc(x - 5, y + 2, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 5, y + 2, 12, 0, Math.PI * 2);
    ctx.fill();
  }

  drawRoad() {
    // Road base
    ctx.fillStyle = '#555';
    ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, CANVAS_H);

    // Road edges (yellow lines)
    ctx.fillStyle = '#FFD600';
    ctx.fillRect(ROAD_LEFT - 4, 0, 4, CANVAS_H);
    ctx.fillRect(ROAD_RIGHT, 0, 4, CANVAS_H);

    // Shoulder
    ctx.fillStyle = '#666';
    ctx.fillRect(ROAD_LEFT - 8, 0, 4, CANVAS_H);
    ctx.fillRect(ROAD_RIGHT + 4, 0, 4, CANVAS_H);

    // Lane markings (white dashes)
    const dashLen = 40;
    const gapLen = 30;
    const totalLen = dashLen + gapLen;
    ctx.fillStyle = '#FFF';
    for (let lane = 1; lane < 3; lane++) {
      const lx = ROAD_LEFT + lane * LANE_WIDTH;
      let y = (this.roadOffset % totalLen) - totalLen;
      while (y < CANVAS_H + totalLen) {
        ctx.fillRect(lx - 2, y, 4, dashLen);
        y += totalLen;
      }
    }
  }

  drawObstacles() {
    for (const obs of this.obstacles) {
      obs.draw(ctx);
    }
  }

  drawPlayer() {
    this.player.draw(ctx);
  }

  drawUI() {
    const lvlIdx = getLevelIndex(this.score);
    const lvl = LEVELS[lvlIdx];
    const nextLvl = LEVELS[Math.min(lvlIdx + 1, LEVELS.length - 1)];

    // Fuel bar background
    const barX = 8, barY = 12, barW = 152, barH = 16;

    // Dark background strip across entire top bar
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.roundRect(4, 6, CANVAS_W - 8, 36, 10);
    ctx.fill();

    // Fuel bar fill — blue tones to contrast with green grass
    const fuelPct = this.player.fuel / FUEL_MAX;
    let fuelColorHi, fuelColorLo;
    if (fuelPct > 0.5) { fuelColorHi = '#42A5F5'; fuelColorLo = '#1E88E5'; }
    else if (fuelPct > 0.2) { fuelColorHi = '#FF9800'; fuelColorLo = '#F57C00'; }
    else { fuelColorHi = '#EF5350'; fuelColorLo = '#C62828'; }

    if (fuelPct > 0) {
      const fuelGrad = ctx.createLinearGradient(barX, 0, barX + barW * fuelPct, 0);
      fuelGrad.addColorStop(0, fuelColorHi);
      fuelGrad.addColorStop(1, fuelColorLo);
      ctx.fillStyle = fuelGrad;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW * fuelPct, barH, 8);
      ctx.fill();
    }

    // Fuel bar border
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, 8);
    ctx.stroke();

    // Fuel label
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 9px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('⛽ ' + Math.floor(this.player.fuel) + '%', barX + barW/2, barY + 11);

    // Warning flash when low
    if (fuelPct <= 0.2 && this.state === STATE.PLAYING && Math.floor(this.elapsedTime * 4) % 2 === 0) {
      ctx.fillStyle = 'rgba(244,67,54,0.4)';
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, barH, 8);
      ctx.fill();
    }

    // Nitro indicators — right next to fuel bar
    const nitroStartX = barX + barW + 8;
    for (let i = 0; i < NITRO_MAX; i++) {
      const nx = nitroStartX + i * 28;
      const ny = barY + 1;
      const active = i < this.player.nitroCharges;

      ctx.fillStyle = active ? '#7C4DFF' : 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.roundRect(nx, ny, 24, 14, 7);
      ctx.fill();

      if (active) {
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 7px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('N₂O', nx + 12, ny + 10);
      }
    }

    // Level badge — right next to nitro
    const lvlX = nitroStartX + NITRO_MAX * 28 + 8;
    ctx.fillStyle = lvl.color;
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(lvl.icon + lvl.name, lvlX, barY + 12);

    // Mini progress bar under level badge
    if (lvlIdx < LEVELS.length - 1) {
      const progW = 46, progH = 3;
      const progX = lvlX;
      const progY = barY + barH - 4;
      const progress = Math.min(1, (this.score - lvl.threshold) / (nextLvl.threshold - lvl.threshold));

      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.roundRect(progX, progY, progW, progH, 1.5);
      ctx.fill();

      ctx.fillStyle = lvl.color;
      ctx.beginPath();
      ctx.roundRect(progX, progY, progW * progress, progH, 1.5);
      ctx.fill();
    }

    // Score — far right
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 15px Arial';
    ctx.textAlign = 'right';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.strokeText('⭐ ' + this.score, CANVAS_W - 8, barY + 12);
    ctx.fillText('⭐ ' + this.score, CANVAS_W - 8, barY + 12);

    // Speed indicator
    if (this.player.nitroActive) {
      ctx.fillStyle = '#64B5F6';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'right';
      ctx.fillText('🔥 NITRO!', CANVAS_W - 12, 52);
    } else if (this.player.slowed) {
      ctx.fillStyle = '#FF9800';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'right';
      ctx.fillText('🐌 减速中', CANVAS_W - 12, 52);
    }

    // Combo indicator
    if (this.player.combo >= 2) {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🔥 x' + this.player.combo + ' COMBO!', CANVAS_W/2, 70);
    }
  }

  drawMenu() {
    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Title
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 42px Arial';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.strokeText('🏎️ 学习赛车', CANVAS_W/2, 200);
    ctx.fillText('🏎️ 学习赛车', CANVAS_W/2, 200);

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('Study Race', CANVAS_W/2, 235);

    // Instructions
    ctx.fillStyle = '#FFF';
    ctx.font = '18px Arial';
    const instructions = [
      ['⬅ ➡', '切换车道'],
      ['空格', '氮气加速'],
      ['💣', '躲避炸弹和障碍物'],
      ['💰', '收集金币'],
      ['❓', '答题获得燃油和氮气'],
    ];

    instructions.forEach(([key, desc], i) => {
      const y = 320 + i * 42;
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(key, CANVAS_W/2 - 100, y);
      ctx.fillStyle = '#FFF';
      ctx.font = '16px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(desc, CANVAS_W/2 - 50, y);
    });

    // Best score
    if (this.bestScore > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🏆 最高分: ' + this.bestScore, CANVAS_W/2, 555);
    }

    // Start prompt
    const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('按 空格键 或 点击屏幕 开始', CANVAS_W/2, 640);

    // Draw a demo car
    ctx.save();
    ctx.translate(CANVAS_W/2, 700);
    ctx.scale(0.8, 0.8);
    this.player.draw(ctx);
    ctx.restore();
  }

  drawCountdown() {
    const count = Math.ceil(this.startCountdown);
    const alpha = this.startCountdown - Math.floor(this.startCountdown);
    const scale = 1 + (1 - alpha) * 0.5;

    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    ctx.fillStyle = '#FFF';
    ctx.font = `bold ${120 * scale}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 6;
    ctx.strokeText(String(count), CANVAS_W/2, CANVAS_H/2);
    ctx.fillText(String(count), CANVAS_W/2, CANVAS_H/2);

    if (count === 1) {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 28px Arial';
      ctx.fillText('准备出发!', CANVAS_W/2, CANVAS_H/2 + 80);
    }
    ctx.restore();
  }

  drawGameOver() {
    const lvlIdx = getLevelIndex(this.score);
    const lvl = LEVELS[lvlIdx];

    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Game over text
    ctx.fillStyle = '#f44336';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText('游戏结束', CANVAS_W/2, 170);
    ctx.fillText('游戏结束', CANVAS_W/2, 170);

    // Level badge
    ctx.fillStyle = lvl.color;
    ctx.font = 'bold 22px Arial';
    ctx.fillText(lvl.icon + ' 达到等级：' + lvl.name, CANVAS_W/2, 215);

    // Stats
    ctx.font = '19px Arial';
    const lines = [
      ['最终得分', this.score],
      ['答对题目', this.totalCorrect + ' 题'],
      ['最大连击', this.maxCombo + ' 连击'],
      ['最高记录', this.bestScore],
    ];

    lines.forEach(([label, value], i) => {
      const y = 270 + i * 44;
      ctx.fillStyle = '#AAA';
      ctx.textAlign = 'right';
      ctx.fillText(label + '：', CANVAS_W/2 - 10, y);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(String(value), CANVAS_W/2 + 10, y);
      ctx.font = '19px Arial';
    });

    // Restart prompt
    const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('按 空格键 / 点击屏幕 重新开始', CANVAS_W/2, 480);

    // Share hint
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '14px Arial';
    ctx.fillText('点击下方按钮保存分享图', CANVAS_W/2, 510);
  }

  generateShareImage() {
    const lvlIdx = getLevelIndex(this.score);
    const lvl = LEVELS[lvlIdx];

    // Create offscreen canvas for share card (600x800)
    const cardW = 600, cardH = 800;
    const offCanvas = document.createElement('canvas');
    offCanvas.width = cardW;
    offCanvas.height = cardH;
    const c = offCanvas.getContext('2d');

    // Background gradient
    const bgGrad = c.createLinearGradient(0, 0, 0, cardH);
    bgGrad.addColorStop(0, '#1a1a2e');
    bgGrad.addColorStop(0.5, '#16213e');
    bgGrad.addColorStop(1, '#0f3460');
    c.fillStyle = bgGrad;
    c.fillRect(0, 0, cardW, cardH);

    // Decorative circles
    c.fillStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i < 12; i++) {
      c.beginPath();
      c.arc(Math.random() * cardW, Math.random() * cardH, 30 + Math.random() * 80, 0, Math.PI*2);
      c.fill();
    }

    // Title
    c.fillStyle = '#FFD700';
    c.font = 'bold 50px Arial';
    c.textAlign = 'center';
    c.fillText('🏎️ 学习赛车', cardW/2, 100);

    c.fillStyle = '#FFF';
    c.font = 'bold 22px Arial';
    c.fillText('Study Race', cardW/2, 140);

    // Level badge (large)
    const badgeY = 200;
    c.fillStyle = lvl.color;
    c.font = 'bold 36px Arial';
    c.fillText(lvl.icon + ' ' + lvl.name, cardW/2, badgeY);

    // Score (huge)
    c.fillStyle = '#FFD700';
    c.font = 'bold 72px Arial';
    c.fillText(String(this.score), cardW/2, 290);
    c.fillStyle = '#AAA';
    c.font = '20px Arial';
    c.fillText('最终得分', cardW/2, 320);

    // Divider
    c.strokeStyle = 'rgba(255,255,255,0.2)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(80, 360);
    c.lineTo(cardW - 80, 360);
    c.stroke();

    // Stats
    const statX = 120;
    let statY = 410;
    const stats = [
      ['🏆', '最高记录', String(this.bestScore)],
      ['✅', '答对题目', this.totalCorrect + ' 题'],
      ['🔥', '最大连击', this.maxCombo + ' 连击'],
      ['🎯', '当前等级', lvl.icon + ' ' + lvl.name],
    ];

    stats.forEach(([icon, label, value]) => {
      c.fillStyle = '#FFF';
      c.font = 'bold 28px Arial';
      c.textAlign = 'left';
      c.fillText(icon + '  ' + label, statX, statY);

      c.fillStyle = '#FFD700';
      c.font = 'bold 28px Arial';
      c.textAlign = 'right';
      c.fillText(value, cardW - statX, statY);

      statY += 58;
    });

    // Quote
    statY += 20;
    c.fillStyle = 'rgba(255,255,255,0.5)';
    c.font = 'italic 18px Arial';
    c.textAlign = 'center';
    c.fillText('"学习如逆水行舟，不进则退"', cardW/2, statY);

    // Footer
    c.fillStyle = 'rgba(255,255,255,0.3)';
    c.font = '14px Arial';
    c.fillText('🏎️ 学习赛车 Study Race', cardW/2, cardH - 30);

    // Convert to image and download
    offCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `studyrace_${this.score}_${lvl.name}.png`;
      a.click();
      URL.revokeObjectURL(url);

      // Also try to copy to clipboard on supported browsers
      if (navigator.clipboard && navigator.clipboard.write) {
        try {
          const item = new ClipboardItem({ 'image/png': blob });
          navigator.clipboard.write([item]).then(() => {
            // flash feedback on button
            const btn = document.getElementById('share-btn');
            btn.textContent = '✅ 已复制到剪贴板!';
            setTimeout(() => { btn.textContent = '📸 保存分享图'; }, 2000);
          }).catch(() => {});
        } catch(e) {}
      }
    }, 'image/png');
  }
}

// ============ MAIN LOOP ============
const game = new Game();
let lastTime = performance.now();

function gameLoop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt <= 0) dt = 0.016;
  lastTime = timestamp;

  game.update(dt);
  game.render();

  requestAnimationFrame(gameLoop);
}

// ============ EVENT HANDLERS ============
function handleStart(e) {
  if (game.state === STATE.MENU) {
    initAudio();
    game.start();
  } else if (game.state === STATE.GAMEOVER) {
    game.start();
  }
  e.preventDefault();
}

canvas.addEventListener('click', handleStart);
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (game.state === STATE.MENU || game.state === STATE.GAMEOVER) {
      handleStart(e);
    }
  }
});

// Share button
document.getElementById('share-btn').addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  if (game.state === STATE.GAMEOVER) {
    game.generateShareImage();
  }
});
document.getElementById('share-btn').addEventListener('touchstart', e => {
  e.preventDefault();
  e.stopPropagation();
  if (game.state === STATE.GAMEOVER) {
    game.generateShareImage();
  }
});

// ============ START ============
requestAnimationFrame(gameLoop);
</script>
